blind_walk_controller:
  joints: {
    type: string_array,
    default_value: [],
    description: "Specifies joints used by the controller. If state joints parameter is defined, then only command joints are defined with this parameter.",
    read_only: true,
    validation: {
      unique<>: null,
      not_empty<>: null,
    }
  }
  state_joints: {
    type: string_array,
    default_value: [],
    description: "(optional) Specifies joints for reading states. This parameter is only relevant when state joints are different then command joint, i.e., when a following controller is used.",
    read_only: true,
    validation: {
      unique<>: null,
    }
  }
  initial_joint_positions: {
    type: double_array,
    default_value: [],
    description: "initial joint positions to be set before the walking policy activates",
    read_only: true,
  }
  interface_name: {
    type: string,
    default_value: "",
    description: "Name of the interface used by the controller on joints and command_joints.",
    read_only: true,
    validation: {
      not_empty<>: null,
      one_of<>: [["position", "velocity", "acceleration", "effort",]],
    }
  } 
  kp: {
    type: double,
    default_value: 10.0,
    description: "Default proportional gain for all joints. This can be overridden by individual joint parameters.",
    read_only: false,
    validation: {
      gt<>: [0.0],
    }
  }
  kd: {
    type: double,
    default_value: 1.0,
    description: "Default derivative gain for all joints. This can be overridden by individual joint parameters.",
    read_only: false,
    validation: {
      gt<>: [0.0],
    }
  }
  shm_name: {
    type: string,
    default_value: "biped_walk_controller_shm",
    description: "Name of the shared memory segment to connect to for receiving walking policy sensor data and commands.",
    read_only: true,
    validation: {
      not_empty<>: null,
    }
  }
